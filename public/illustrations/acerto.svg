<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="ace-title">
  <title id="ace-title">Equipe do taller e recibo do acerto semanal</title>
  <defs>
    <pattern id="ace-dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#121D29"/></pattern>
  </defs>
  <rect width="480" height="480" rx="40" fill="#C8562B"/>
  <circle cx="240" cy="250" r="190" fill="#E07A4F"/>
  <circle cx="400" cy="90" r="70" fill="url(#ace-dots)" opacity="0.35"/>
  <!-- pessoa 1 -->
  <g transform="translate(40 150)">
    <path d="M0 330 C 6 240, 50 200, 100 196 C 150 200, 194 240, 200 330 Z" fill="#2E9E6A"/>
    <rect x="80" y="160" width="40" height="44" rx="10" fill="#8E5A3E"/>
    <ellipse cx="100" cy="128" rx="56" ry="64" fill="#A86F4C"/>
    <path d="M44 120 C 44 60, 156 56, 156 120 C 140 96, 70 94, 44 120 Z" fill="#121D29"/>
    <path d="M78 132 q 8 -8 16 0 M108 132 q 8 -8 16 0" stroke="#121D29" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M86 156 q 14 12 28 0" stroke="#121D29" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- pessoa 2 -->
  <g transform="translate(250 170)">
    <path d="M0 310 C 6 230, 46 194, 96 190 C 146 194, 186 230, 192 310 Z" fill="#1C4066"/>
    <rect x="76" y="156" width="40" height="40" rx="10" fill="#B97A57"/>
    <ellipse cx="96" cy="122" rx="54" ry="62" fill="#C98B67"/>
    <path d="M40 130 C 34 50, 160 40, 152 130 C 150 96, 120 80, 96 80 C 70 80, 44 96, 40 130 Z" fill="#121D29"/>
    <circle cx="96" cy="58" r="26" fill="#121D29"/>
    <path d="M74 124 q 8 -8 16 0 M104 124 q 8 -8 16 0" stroke="#121D29" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M82 148 q 14 12 28 0" stroke="#121D29" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- recibo -->
  <g transform="translate(170 40) rotate(4)">
    <path d="M0 0 H 150 V 170 l -15 -10 l -15 10 l -15 -10 l -15 10 l -15 -10 l -15 10 l -15 -10 l -15 10 l -15 -10 l -15 10 Z" fill="#FEFCF8"/>
    <rect x="16" y="18" width="80" height="10" rx="5" fill="#1C4066"/>
    <rect x="16" y="42" width="118" height="7" rx="3.5" fill="#C9C1B4"/>
    <rect x="16" y="58" width="96" height="7" rx="3.5" fill="#C9C1B4"/>
    <path d="M16 82 h 118" stroke="#121D29" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="16" y="120" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="800" fill="#121D29">R$ 420</text>
    <rect x="16" y="134" width="60" height="8" rx="4" fill="#2E9E6A"/>
  </g>
  <path d="M60 70 v 30 M45 85 h 30" stroke="#FEFCF8" stroke-width="6" stroke-linecap="round"/>
