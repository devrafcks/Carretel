<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="calc-title">
  <title id="calc-title">Calculadora, tesoura e etiqueta de preço por peça</title>
  <defs>
    <pattern id="calc-dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#121D29"/></pattern>
  </defs>
  <rect width="480" height="480" rx="40" fill="#EFE7DB"/>
  <circle cx="250" cy="250" r="200" fill="#7FA3D8"/>
  <circle cx="90" cy="380" r="80" fill="url(#calc-dots)" opacity="0.3"/>
  <path d="M380 -20 L 460 -20 L 260 500 L 180 500 Z" fill="#F2B33D"/>
  <!-- calculadora -->
  <g transform="translate(110 90) rotate(-8)">
    <rect x="0" y="0" width="200" height="290" rx="26" fill="#1C4066"/>
    <rect x="20" y="22" width="160" height="66" rx="12" fill="#E2F2E5"/>
    <text x="38" y="70" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="800" fill="#143C1F">+240</text>
    <g fill="#FEFCF8">
      <rect x="20" y="108" width="40" height="36" rx="10"/><rect x="80" y="108" width="40" height="36" rx="10"/><rect x="140" y="108" width="40" height="36" rx="10" fill="#C8562B"/>
      <rect x="20" y="156" width="40" height="36" rx="10"/><rect x="80" y="156" width="40" height="36" rx="10"/><rect x="140" y="156" width="40" height="36" rx="10" fill="#C8562B"/>
      <rect x="20" y="204" width="40" height="36" rx="10"/><rect x="80" y="204" width="40" height="36" rx="10"/><rect x="140" y="204" width="40" height="84" rx="10" fill="#2E9E6A"/>
      <rect x="20" y="252" width="100" height="36" rx="10"/>
    </g>
  </g>
  <!-- etiqueta de preço -->
  <g transform="translate(290 250) rotate(14)">
    <path d="M0 0 H 120 L 150 40 L 120 80 H 0 Z" fill="#C8562B"/>
    <circle cx="124" cy="40" r="8" fill="#EFE7DB"/>
    <text x="14" y="52" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="800" fill="#FEFCF8">3,00</text>
  </g>
  <!-- tesoura -->
  <g transform="translate(300 90) rotate(30)">
    <circle cx="20" cy="20" r="20" fill="none" stroke="#121D29" stroke-width="10"/>
    <circle cx="20" cy="80" r="20" fill="none" stroke="#121D29" stroke-width="10"/>
    <path d="M36 32 L 130 66 M36 68 L 130 34" stroke="#9AA3AD" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
