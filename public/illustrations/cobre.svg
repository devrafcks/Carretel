  </defs>
  <rect width="480" height="480" rx="40" fill="#2E9E6A"/>
  <circle cx="380" cy="120" r="130" fill="#1F7A50"/>
  <circle cx="80" cy="90" r="70" fill="url(#cob-dots)" opacity="0.4"/>
  <path d="M-20 420 L 500 300 L 500 500 L -20 500 Z" fill="#1C4066"/>
  <!-- calendário -->
  <g transform="translate(250 70) rotate(6)">
