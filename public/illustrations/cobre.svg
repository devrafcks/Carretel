    <rect x="10" y="80" width="140" height="30" fill="#D29D63"/>
    <ellipse cx="80" cy="80" rx="70" ry="20" fill="#F2B33D"/>
    <rect x="10" y="50" width="140" height="30" fill="#D29D63"/>
    <ellipse cx="80" cy="50" rx="70" ry="20" fill="#F2B33D"/>
