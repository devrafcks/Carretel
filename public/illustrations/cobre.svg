    </g>
    <rect x="96" y="96" width="26" height="22" rx="5" fill="#C8562B"/>
    <circle cx="147" cy="141" r="17" fill="#F2B33D"/>
    <text x="139" y="148" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="800" fill="#121D29">12</text>
