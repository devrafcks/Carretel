      <rect x="80" y="20" width="14" height="14"/><rect x="98" y="38" width="14" height="14"/><rect x="80" y="56" width="14" height="14"/>
      <rect x="80" y="84" width="14" height="14"/><rect x="20" y="84" width="14" height="14"/><rect x="46" y="98" width="14" height="14"/>
      <rect x="98" y="98" width="14" height="14"/><rect x="124" y="84" width="14" height="14"/><rect x="152" y="98" width="14" height="14"/>
      <rect x="84" y="124" width="14" height="14"/><rect x="124" y="124" width="14" height="14"/><rect x="152" y="152" width="14" height="14"/>
